name: Deploy Beauty Directory Theme to ConoHa WING

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 8022 -H www1012.conoha.ne.jp >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 8022 c3659606@www1012.conoha.ne.jp "echo 'SSH OK'"

      - name: Deploy Beauty Directory Theme files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: www1012.conoha.ne.jp
          port: 8022
          username: c3659606
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

          # ✔ リポジトリ直下のファイルをデプロイする
          local_path: ./

          # ✔ beauty-directory テーマフォルダにアップロード
          remote_path: "public_html/www.flat-top.jp/wp-content/themes/beauty-directory/"

          sftp_only: false
          delete_remote_files: false
          
          # 除外ファイル・ディレクトリ
          # - 開発環境ファイル
          # - 自動ブログ投稿システム関連
          # - ドキュメントファイル
          rsyncArgs: "--exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='.env' --exclude='.DS_Store' --exclude='scripts/' --exclude='data/' --exclude='seo_keywords.json' --exclude='*.py' --exclude='*.md' --exclude='*.json' --exclude='.deployignore' --exclude='AUTO_BLOG_GUIDE.md' --exclude='PLUGIN_README.md'"
